<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omexla Creativity Studio v5.0 - Enterprise Neural Canvas Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="omexla-app-root">

  <!-- ==========================================================================
       TOP GLOBAL STATUS & TELEMETRY HEADER
       ========================================================================== -->
  <header class="app-topbar" role="banner">
    <div class="topbar-left">
      <div class="brand-cluster">
        <div class="neural-pulse-dot" aria-hidden="true"></div>
        <span class="brand-title">Omexla Creativity Studio</span>
      </div>
      <div class="version-pill">v5.0 Pro Studio</div>
    </div>

    <div class="topbar-center" role="region" aria-label="Quick Session Metrics">
      <div class="telemetry-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="sessionTimer">00:00</span>
      </div>
      <div class="telemetry-badge hidden-mobile">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        <span id="canvasResIndicator">1920x1080px</span>
      </div>
    </div>

    <div class="topbar-right">
      <button class="topbar-icon-btn" id="themeToggleBtn" title="Toggle Light/Dark Theme" onclick="toggleTheme()" aria-label="Toggle Theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="topbar-icon-btn" id="fullscreenBtn" title="Toggle Fullscreen Workspace" onclick="toggleFullscreen()" aria-label="Toggle Fullscreen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
    </div>
  </header>

  <!-- ==========================================================================
       MAIN WORKSPACE GRID CONTAINER
       ========================================================================== -->
  <div class="workspace-grid">

    <!-- ========================================================================
         LEFT SIDEBAR: TOOLS, BRUSHES & GEOMETRIC SHAPES
         ======================================================================== -->
    <aside class="sidebar-panel left-sidebar" aria-label="Drawing Tools Sidebar">
      
      <!-- Section: Drawing Engines -->
      <div class="panel-section">
        <div class="section-title">Brush Engine</div>
        <div class="tools-grid-2col">
          <button class="tool-card active" data-tool="brush" onclick="setTool('brush')" title="Standard Smooth Brush">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>Brush</span>
          </button>
          <button class="tool-card" data-tool="pen" onclick="setTool('pen')" title="Precision Ink Pen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            <span>Ink Pen</span>
          </button>
          <button class="tool-card" data-tool="marker" onclick="setTool('marker')" title="Wide Surface Marker">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15.5 3.5a2.121 2.121 0 0 1 3 3L7 18l-4 1 1-4L15.5 3.5z"/></svg>
            <span>Marker</span>
          </button>
          <button class="tool-card" data-tool="calligraphy" onclick="setTool('calligraphy')" title="Calligraphy Nib">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span>Nib</span>
          </button>
          <button class="tool-card" data-tool="airbrush" onclick="setTool('airbrush')" title="Spray Airbrush Particle Engine">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Airbrush</span>
          </button>
          <button class="tool-card" data-tool="glow" onclick="setTool('glow')" title="Neon Glow FX">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg>
            <span>Neon Glow</span>
          </button>
        </div>
      </div>

      <!-- Section: Geometric Vector Shapes -->
      <div class="panel-section">
        <div class="section-title">Geometric Shapes</div>
        <div class="tools-grid-3col">
          <button class="shape-card active" data-shape="none" onclick="setShape('none')" title="Freehand Stroke">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18"/></svg>
            <span>Free</span>
          </button>
          <button class="shape-card" data-shape="rectangle" onclick="setShape('rectangle')" title="Rectangle Outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
            <span>Rect</span>
          </button>
          <button class="shape-card" data-shape="fill-rect" onclick="setShape('fill-rect')" title="Solid Rectangle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
            <span>Solid Rect</span>
          </button>
          <button class="shape-card" data-shape="circle" onclick="setShape('circle')" title="Circle Outline">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
            <span>Circle</span>
          </button>
          <button class="shape-card" data-shape="fill-circle" onclick="setShape('fill-circle')" title="Solid Circle">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9"/></svg>
            <span>Solid Circle</span>
          </button>
          <button class="shape-card" data-shape="line" onclick="setShape('line')" title="Straight Line">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
            <span>Line</span>
          </button>
        </div>
      </div>

      <!-- Section: Utility Operations (Eraser & Flood Fill) -->
      <div class="panel-section">
        <div class="section-title">Utilities</div>
        <div class="tools-grid-2col">
          <button class="tool-card" data-tool="eraser" onclick="setTool('eraser')" title="Precision Eraser">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16c-1.5-1.5-1.5-4 0-5.5l9-9c1.5-1.5 4-1.5 5.5 0l2.5 2.5c1.5 1.5 1.5 4 0 5.5L12 19"/><path d="M6 11l8 8"/></svg>
            <span>Eraser</span>
          </button>
          <button class="tool-card" data-tool="bucket" onclick="setTool('bucket')" title="Flood Fill Paint Bucket">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 11l-8-8-8.5 8.5a2.12 2.12 0 0 0 0 3l7 7a2.12 2.12 0 0 0 3 0L19 11z"/><path d="M5 2v2M2 5h2M2 19h20"/></svg>
            <span>Paint Fill</span>
          </button>
        </div>
      </div>

    </aside>

    <!-- ========================================================================
         CENTER VIEWPORT: CANVAS STAGE & FLOATING ACTION HEAD-UP DISPLAY
         ======================================================================== -->
    <main class="canvas-stage-wrapper" role="main">
      
      <!-- Floating HUD Bar over Canvas -->
      <div class="stage-hud-bar">
        <div class="hud-group">
          <button class="hud-btn" id="undoBtn" onclick="undoCanvas()" title="Undo Step (Ctrl+Z)" aria-label="Undo">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 14L4 9l5-5"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
            <span class="hidden-mobile">Undo</span>
          </button>
          <button class="hud-btn" id="redoBtn" onclick="redoCanvas()" title="Redo Step (Ctrl+Y)" aria-label="Redo">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 14l5-5-5-5"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
            <span class="hidden-mobile">Redo</span>
          </button>
        </div>

        <div class="hud-group">
          <button class="hud-btn danger-hover" onclick="clearCanvasPrompt()" title="Wipe Canvas Workspace">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            <span class="hidden-mobile">Clear</span>
          </button>
          <button class="hud-btn primary-glow" onclick="openDownloadModal()" title="Export High-Res Masterpiece">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            <span>Export</span>
          </button>
        </div>
      </div>

      <!-- Main HTML5 Render Canvas Viewport -->
      <div class="canvas-container" id="canvasContainer">
        <canvas id="paintCanvas"></canvas>
        
        <!-- Error Banner / Notification Toast (Template Fallback) -->
        <div class="toast-banner" id="toastBanner" role="alert" aria-live="polite">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span id="toastMessage">Template loaded successfully.</span>
        </div>
      </div>

    </main>

    <!-- ========================================================================
         RIGHT SIDEBAR: STROKE CONFIG, COLOR PALETTE, TEMPLATES & FILTERS
         ======================================================================== -->
    <aside class="sidebar-panel right-sidebar" aria-label="Properties and Color Hub">
      
      <!-- Section: Stroke & Size Configuration -->
      <div class="panel-section">
        <div class="section-title flex-between">
          <span>Stroke Size</span>
          <span class="value-highlight" id="sizeValLabel">5px</span>
        </div>
        <div class="slider-control-group">
          <input type="range" id="brushSize" class="custom-range" min="1" max="80" value="5" oninput="updateBrushSize(this.value)" aria-label="Brush Size Slider">
        </div>
      </div>

      <!-- Section: Color Hub & Infinite Palette -->
      <div class="panel-section">
        <div class="section-title flex-between">
          <span>Color Hub</span>
          <div class="color-preview-badge" id="colorPreviewBadge" style="background: #38bdf8;"></div>
        </div>
        
        <div class="color-picker-main-row">
          <input type="color" id="brushColor" value="#38bdf8" oninput="updateColor(this.value)" aria-label="Color Picker">
          <input type="text" id="hexInput" class="hex-input-box" value="#38bdf8" onchange="updateColorHex(this.value)" aria-label="HEX Color Code">
        </div>

        <!-- Quick Preset Swatches -->
        <div class="swatches-grid">
          <div class="swatch-item" style="background:#0f172a;" onclick="updateColor('#0f172a')"></div>
          <div class="swatch-item" style="background:#f8fafc; border:1px solid #cbd5e1;" onclick="updateColor('#f8fafc')"></div>
          <div class="swatch-item" style="background:#f43f5e;" onclick="updateColor('#f43f5e')"></div>
          <div class="swatch-item" style="background:#38bdf8;" onclick="updateColor('#38bdf8')"></div>
          <div class="swatch-item" style="background:#10b981;" onclick="updateColor('#10b981')"></div>
          <div class="swatch-item" style="background:#8b5cf6;" onclick="updateColor('#8b5cf6')"></div>
          <div class="swatch-item" style="background:#fbbf24;" onclick="updateColor('#fbbf24')"></div>
          <div class="swatch-item" style="background:#ec4899;" onclick="updateColor('#ec4899')"></div>
        </div>
      </div>

      <!-- Section: Neural Templates -->
      <div class="panel-section">
        <div class="section-title">Canvas Templates</div>
        <div class="templates-stack">
          <button class="template-card-btn" onclick="loadTemplate('cyberpunk')">
            <span class="t-title">Cyberpunk Grid</span>
            <span class="t-desc">Neon cityscape reference</span>
          </button>
          <button class="template-card-btn" onclick="loadTemplate('mandala')">
            <span class="t-title">Geometric Mandala</span>
            <span class="t-desc">Symmetric vector star</span>
          </button>
          <button class="template-card-btn" onclick="loadTemplate('blueprint')">
            <span class="t-title">Architectural Grid</span>
            <span class="t-desc">Technical blueprint layout</span>
          </button>
        </div>
      </div>

      <!-- Section: Advanced Canvas Filters & Effects -->
      <div class="panel-section">
        <div class="section-title">FX Post-Processing</div>
        <div class="tools-grid-2col">
          <button class="action-btn-flat" onclick="applyFilter('invert')">Invert Colors</button>
          <button class="action-btn-flat" onclick="applyFilter('grayscale')">Grayscale</button>
          <button class="action-btn-flat" onclick="applyFilter('sepia')">Sepia Tone</button>
          <button class="action-btn-flat" onclick="applyFilter('brightness')">Vivid Boost</button>
        </div>
      </div>

    </aside>

  </div>

  <!-- ==========================================================================
       MODAL: ELITE EXPORT & DOWNLOAD DIALOGUE
       ========================================================================== -->
  <div class="modal-overlay" id="downloadModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-dialog-card">
      <div class="modal-header">
        <h3 id="modalTitle">Export Masterpiece</h3>
        <button class="modal-close-x" onclick="closeDownloadModal()" aria-label="Close modal">×</button>
      </div>
      <p class="modal-subtitle">Choose your preferred ultra-high-definition format for download:</p>
      
      <div class="export-options-grid">
        <button class="export-format-card" onclick="executeDownload('png')">
          <div class="ef-title">PNG Document</div>
          <div class="ef-desc">Lossless clarity with transparent / solid options</div>
        </button>
        <button class="export-format-card" onclick="executeDownload('jpeg')">
          <div class="ef-title">JPEG Raster</div>
          <div class="ef-desc">Compressed standard web format</div>
        </button>
        <button class="export-format-card" onclick="executeDownload('webp')">
          <div class="ef-title">WebP Matrix</div>
          <div class="ef-desc">Next-gen high compression format</div>
        </button>
      </div>

      <div class="modal-footer-row">
        <button class="action-btn-flat" onclick="closeDownloadModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- External JavaScript Renderer & Logic Bundle -->
  <script src="app.js"></script>
</body>
</html>
